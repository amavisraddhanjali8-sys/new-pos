version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID:-041436772015}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_RESOURCE_ARN=${AWS_RESOURCE_ARN:-arn:aws:rds:us-east-1:041436772015:cluster:innovistaposdbaws}
      - AWS_ROLE_ARN=${AWS_ROLE_ARN:-arn:aws:iam::041436772015:role/Vercel/access-innovistaposdbaws}
      - PGDATABASE=${PGDATABASE:-postgres}
      - PGHOST=${PGHOST:-innovistaposdbaws.cluster-cct88acowp78.us-east-1.rds.amazonaws.com}
      - PGPORT=${PGPORT:-5432}
      - PGSSLMODE=${PGSSLMODE:-require}
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-}
    volumes:
      - pos_data:/app/data

volumes:
  pos_data:
